quarkus.application.name=rh-quarkus
quarkus.http.port=8080

# H2 em memória — sem Docker. Em produção: PostgreSQL + Dev Services ou JDBC real.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:rh;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql
